<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Számkitaláló</title>
    <style>
        * { box-sizing: border-box; }

        :root {
            --bg: #262626;
            --panel: #333333;
            --panel-dark: #1d1d1d;
            --line: #555555;
            --text: #e7e7e7;
            --muted: #9b9b9b;
            --accent: #d8c37a;
            --danger: #c97878;
        }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            background: #262626;
            color: var(--text);
            font-family: "Trebuchet MS", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .console {
            width: min(560px, 100%);
            background: var(--panel);
            border: 1px solid #111;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 14px 35px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
            position: relative;
        }

        .speaker {
            position: absolute;
            right: 22px;
            top: 22px;
            width: 62px;
            height: 34px;
            background: repeating-linear-gradient(0deg, #1b1b1b 0 3px, transparent 3px 7px);
            opacity: .65;
        }

        .screen {
            background: #171717;
            border: 4px solid #111;
            border-radius: 9px;
            padding: 24px;
            box-shadow: inset 0 0 25px rgba(0,0,0,.55);
        }

        .brand {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--muted);
            margin-bottom: 5px;
        }

        h1 {
            margin: 0 0 5px;
            font-size: 30px;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 22px;
        }

        .difficulty {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            border: 1px solid #5f5f5f;
            background: #292929;
            color: #d8d8d8;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            transition: transform .12s, background .12s, border-color .12s;
        }

        button:hover { transform: translateY(-1px); border-color: #888; background: #353535; }
        button:active { transform: translateY(1px); }

        .difficulty button.active {
            color: #181818;
            background: var(--accent);
            border-color: var(--accent);
            font-weight: bold;
        }

        .label {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 7px;
        }

        .input-row { display: flex; gap: 8px; }

        input[type="number"] {
            min-width: 0;
            flex: 1;
            background: #242424;
            border: 1px solid #606060;
            color: #fff;
            border-radius: 6px;
            padding: 13px;
            font-size: 21px;
            text-align: center;
            outline: none;
        }

        input[type="number"]:focus { border-color: var(--accent); }

        .guess-btn {
            min-width: 112px;
            background: #dedede;
            color: #202020;
            border-color: #eee;
            font-weight: bold;
        }

        .guess-btn:hover { background: #fff; }

        .status {
            margin: 16px 0;
            min-height: 62px;
            border: 1px solid #474747;
            background: #222;
            border-radius: 6px;
            padding: 13px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #cfcfcf;
            font-size: 14px;
        }

        .status.warning { color: var(--accent); }
        .status.success { color: #a9cf9c; border-color: #52624c; }
        .status.error { color: var(--danger); border-color: #634848; }

        .attempts { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }

        .dots { display: flex; gap: 5px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .dot.used { background: var(--accent); }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 19px;
        }

        .stat { background: #202020; border: 1px solid #414141; padding: 9px; text-align: center; border-radius: 5px; }
        .stat small { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .stat strong { display: block; margin-top: 3px; font-size: 16px; }

        .tip { margin-top: 17px; text-align: center; color: #777; font-size: 11px; }

        #loseOverlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
        }

        #skull {
            color: #ddd;
            font-family: "Courier New", monospace;
            font-size: clamp(13px, 2.4vw, 20px);
            line-height: 1.05;
            white-space: pre;
            text-align: center;
            text-shadow: 0 0 4px #fff;
        }

        .skull-show { animation: skullIn .35s steps(3), skullOut 1.5s steps(9) .65s forwards; }

        @keyframes skullIn {
            from { opacity: 0; transform: scale(.65); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes skullOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.65) translate(8px, -8px); filter: blur(1px); }
        }

        .pixel {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #ddd;
            animation: pixelAway .9s steps(6) forwards;
        }

        @keyframes pixelAway {
            to { opacity: 0; transform: translate(var(--x), var(--y)); }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .console { padding: 12px; border-radius: 13px; }
            .screen { padding: 17px; }
            .speaker { display: none; }
            h1 { font-size: 25px; }
            .input-row { flex-direction: column; }
            .guess-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="console">
        <div class="speaker"></div>
        <section class="screen">
            <div class="brand">ELVYNX // MINI GAME</div>
            <h1>Számkitaláló</h1>
            <div class="subtitle">Találd ki a gép számát. Ne siess.</div>

            <div class="label">Nehézség</div>
            <div class="difficulty">
                <button data-difficulty="easy" onclick="setDifficulty('easy')">Könnyű</button>
                <button data-difficulty="normal" onclick="setDifficulty('normal')">Normál</button>
                <button data-difficulty="hard" onclick="setDifficulty('hard')">Nehéz</button>
                <button data-difficulty="extreme" onclick="setDifficulty('extreme')">Extrém</button>
            </div>

            <div class="label">A tipped</div>
            <div class="input-row">
                <input type="number" id="guessInput" placeholder="?" onkeydown="if(event.key === 'Enter') checkGuess()">
                <button class="guess-btn" onclick="checkGuess()">Tipp</button>
            </div>

            <div class="status" id="message">Válassz egy nehézséget a kezdéshez.</div>

            <div class="attempts">
                <span id="progressText">Próbák: 0 / -</span>
                <div class="dots" id="dots"></div>
            </div>

            <div class="stats">
                <div class="stat"><small>Győzelem</small><strong id="wins">0</strong></div>
                <div class="stat"><small>Átlag</small><strong id="average">--</strong></div>
                <div class="stat"><small>Rekord</small><strong id="best">--</strong></div>
            </div>
            <div class="tip">ENTER = tipp &nbsp;•&nbsp; új mód = új játék</div>
        </section>
    </main>

    <div id="loseOverlay"><div id="skull"></div></div>

    <script>
        let secretNumber = 0;
        let attempts = 0;
        let maxAttempts = 7;
        let gameActive = false;
        let gameStartTime = 0;
        let currentDifficulty = null;

        const difficulties = {
            easy: { min: 1, max: 50, attempts: 10 },
            normal: { min: 1, max: 100, attempts: 7 },
            hard: { min: 1, max: 1000, attempts: 5 },
            extreme: { min: 1, max: 10000, attempts: 3 }
        };

        const stats = { wins: 0, totalAttempts: 0, bestGame: Infinity };
        const skullArt = `  .-"""-.
 /       \\
|  x   x  |
|    ^    |
|  \\___/  |
 \\_______/`;

        function setDifficulty(difficulty) {
            currentDifficulty = difficulty;
            const diff = difficulties[difficulty];
            maxAttempts = diff.attempts;
            attempts = 0;
            gameActive = true;
            gameStartTime = Date.now();
            secretNumber = Math.floor(Math.random() * (diff.max - diff.min + 1)) + diff.min;

            document.querySelectorAll('[data-difficulty]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.difficulty === difficulty);
            });

            showMessage(`${diff.min}–${diff.max} között gondoltam egy számot.`, '');
            updateProgress();
            const input = document.getElementById('guessInput');
            input.value = '';
            input.min = diff.min;
            input.max = diff.max;
            input.focus();
        }

        function checkGuess() {
            if (!gameActive) return;

            const input = document.getElementById('guessInput');
            const guess = Number(input.value);
            const diff = difficulties[currentDifficulty];

            if (!Number.isInteger(guess)) {
                showMessage('Írj be egy egész számot.', 'error');
                return;
            }
            if (guess < diff.min || guess > diff.max) {
                showMessage(`A szám ${diff.min} és ${diff.max} között van.`, 'error');
                return;
            }

            attempts++;

            if (guess < secretNumber) {
                showMessage(`Túl alacsony. Még ${maxAttempts - attempts} próbád van.`, 'warning');
            } else if (guess > secretNumber) {
                showMessage(`Túl magas. Még ${maxAttempts - attempts} próbád van.`, 'warning');
            } else {
                const seconds = ((Date.now() - gameStartTime) / 1000).toFixed(1);
                showMessage(`Eltaláltad! ${attempts} próbából, ${seconds} mp alatt.`, 'success');
                stats.wins++;
                stats.totalAttempts += attempts;
                stats.bestGame = Math.min(stats.bestGame, attempts);
                updateStats();
                gameActive = false;
                input.value = '';
                updateProgress();
                return;
            }

            updateProgress();
            input.value = '';
            input.focus();

            if (attempts >= maxAttempts) {
                gameActive = false;
                showMessage(`Vége. A szám ${secretNumber} volt.`, 'error');
                showLoseAnimation();
            }
        }

        function updateProgress() {
            document.getElementById('progressText').textContent = currentDifficulty
                ? `Próbák: ${attempts} / ${maxAttempts}`
                : 'Próbák: 0 / -';

            const dots = document.getElementById('dots');
            dots.innerHTML = '';
            if (currentDifficulty) {
                for (let i = 0; i < maxAttempts; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'dot' + (i < attempts ? ' used' : '');
                    dots.appendChild(dot);
                }
            }
        }

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'status' + (type ? ' ' + type : '');
        }

        function updateStats() {
            document.getElementById('wins').textContent = stats.wins;
            document.getElementById('average').textContent = stats.wins
                ? (stats.totalAttempts / stats.wins).toFixed(1)
                : '--';
            document.getElementById('best').textContent = stats.bestGame === Infinity ? '--' : stats.bestGame;
        }

        function showLoseAnimation() {
            const overlay = document.getElementById('loseOverlay');
            const skull = document.getElementById('skull');
            skull.textContent = skullArt;
            skull.className = '';
            overlay.style.display = 'flex';
            void skull.offsetWidth;
            skull.classList.add('skull-show');

            for (let i = 0; i < 22; i++) {
                const pixel = document.createElement('span');
                pixel.className = 'pixel';
                const angle = Math.random() * Math.PI * 2;
                const distance = 70 + Math.random() * 180;
                pixel.style.left = `calc(50% + ${(Math.random() - .5) * 150}px)`;
                pixel.style.top = `calc(50% + ${(Math.random() - .5) * 100}px)`;
                pixel.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
                pixel.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
                overlay.appendChild(pixel);
                setTimeout(() => pixel.remove(), 950);
            }

            setTimeout(() => {
                overlay.style.display = 'none';
                skull.className = '';
            }, 2300);
        }

        updateProgress();
    </script>
    <script src="https://cdn.counter.dev/script.js" data-id="ae4863f7-4922-43de-b9fc-87f792b147eb" data-utcoffset="2"></script>
</body>
</html>
