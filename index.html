<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0a;
    --panel: #111111;
    --line: #3a3a3a;
    --line-dim: #2a2a2a;
    --text: #d8d8d0;
    --dim: #8a8a82;
    --white: #f2f2ec;
    --blue: #7ab8e0;
    --red: #e05a4e;
    --yellow: #d9b04a;
    --green: #8fae6a;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; min-height:100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'VT323', 'Courier New', monospace;
    -webkit-font-smoothing: none;
  }
  body{
    display:flex; justify-content:center; align-items:flex-start;
    padding: 48px 24px;
  }
  .app{
    display:flex; gap:16px; align-items:flex-start;
    width: 100%; max-width: 1080px;
  }
  .left-col{ display:flex; flex-direction:column; gap:16px; flex: 1 1 auto; min-width:0; }
  .right-col{ display:flex; flex-direction:column; gap:16px; width: 280px; flex-shrink:0; }

  .icon-box{
    width: 62px; height: 62px;
    border: 1px solid var(--line);
    border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    background: var(--panel);
  }
  .icon-box svg{ width: 30px; height: 30px; }

  .panel{
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    padding: 24px;
  }

  h1{
    font-weight: normal;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--white);
    margin: 0 0 16px 0;
    display:flex; align-items:center; gap: 12px;
  }
  .prompt{ color: var(--dim); }

  .divider{
    border: none;
    border-top: 1px dashed var(--line);
    margin: 0 0 20px 0;
  }

  .desc{
    font-size: 20px;
    color: var(--text);
    margin: 0 0 20px 0;
  }

  .guess-row{
    display:flex; gap: 12px; margin-bottom: 20px;
  }
  .guess-row input{
    flex: 1 1 auto;
    background: #0d0d0d;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 20px;
    padding: 12px 16px;
  }
  .guess-row input::placeholder{ color: var(--dim); }
  .guess-row input:focus{ outline: none; border-color: var(--dim); }
  .btn-guess{
    background: #c9c9c0;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: #0a0a0a;
    font-family: inherit;
    font-size: 20px;
    letter-spacing: 1px;
    padding: 12px 28px;
    cursor: pointer;
  }
  .btn-guess:hover{ background: #e2e2da; }
  .btn-guess:disabled{ opacity:.5; cursor:not-allowed; }

  .feedback{
    display:flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 20px;
    min-height: 88px;
  }
  .feedback .half{
    flex: 1; text-align:center; padding: 18px 12px;
  }
  .feedback .half + .half{ border-left: 1px solid var(--line); }
  .feedback .label{ font-size: 20px; }
  .feedback .label.low{ color: var(--blue); }
  .feedback .label.high{ color: var(--red); }
  .feedback .sub{ color: var(--dim); font-size: 18px; margin-top: 4px; }
  .feedback.empty .half{ color: var(--line); }

  .meta-row{
    display:flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 20px;
  }
  .meta-cell{
    flex:1; padding: 14px 16px;
  }
  .meta-cell + .meta-cell{ border-left: 1px solid var(--line); }
  .meta-label{ font-size: 15px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; margin-bottom: 6px; }
  .meta-value{ font-size: 20px; color: var(--yellow); }
  .meta-cell.attempts .meta-value,
  .meta-cell.best .meta-value{ color: var(--text); }
  .change-btn{
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    padding: 4px 12px;
    cursor: pointer;
  }
  .change-btn:hover{ border-color: var(--dim); }

  .progress-box{
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .progress-label{ font-size: 15px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; margin-bottom: 12px; }
  .progress-cells{ display:flex; gap: 8px; flex-wrap: wrap; }
  .cell{
    width: 22px; height: 22px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: transparent;
  }
  .cell.filled{ background: #b9b9b0; border-color: #b9b9b0; }

  .terminal{
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    padding: 20px 24px;
    min-height: 130px;
    font-size: 19px;
    display:flex; flex-direction:column; gap: 6px;
  }
  .terminal .line{ color: var(--dim); }
  .terminal .line.win{ color: var(--green); }
  .terminal .line.lose{ color: var(--red); }
  .terminal .cursor-row{ color: var(--dim); margin-top: auto; }

  /* Right column */
  .side-title{
    font-size: 18px; letter-spacing: 2px; color: var(--white);
    text-transform: uppercase; margin: 0 0 14px 0;
  }
  .stat-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 0;
    border-top: 1px dashed var(--line-dim);
    font-size: 19px;
  }
  .stat-row:first-of-type{ border-top:none; }
  .stat-label{ display:flex; align-items:center; gap: 10px; }
  .stat-icon{ width:16px; text-align:center; }
  .stat-value{ color: var(--text); }
  .stat-value.wins{ color: var(--green); }
  .stat-value.losses{ color: var(--red); }

  .diff-list{ display:flex; flex-direction:column; gap: 8px; margin-top: 4px; }
  .diff-btn{
    display:flex; align-items:center; gap: 10px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 19px;
    letter-spacing: 1px;
    padding: 12px 14px;
    cursor: pointer;
    text-align:left;
  }
  .diff-btn:hover{ border-color: var(--dim); }
  .diff-btn.active{ background: #1c1c1c; border-color: var(--dim); }
  .diff-btn .arrow{ width: 14px; color: var(--white); }
  .diff-btn .range{ color: var(--dim); margin-left: auto; }

  .new-game{
    margin-top: 8px;
    display:flex; align-items:center; justify-content:center; gap: 10px;
    background: #1c1c1c;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 19px;
    letter-spacing: 1px;
    padding: 12px 14px;
    cursor: pointer;
    width: 100%;
  }
  .new-game:hover{ border-color: var(--dim); }

  @media (max-width: 760px){
    .app{ flex-direction: column; }
    .right-col{ width: 100%; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="left-col">
    <div class="icon-box" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d8d8d0" stroke-width="1.4">
        <path d="M12 2C7 2 4 5.5 4 10c0 3 1.6 4.8 2.5 6v3.5c0 .8.7 1.5 1.5 1.5h1v-2h1.5v2h1v-2h1.5v2h1c.8 0 1.5-.7 1.5-1.5V16c.9-1.2 2.5-3 2.5-6 0-4.5-3-8-8-8z"/>
        <circle cx="9" cy="10" r="1.4" fill="#d8d8d0"/>
        <circle cx="15" cy="10" r="1.4" fill="#d8d8d0"/>
      </svg>
    </div>

    <div class="panel">
      <h1><span class="prompt">&gt;_</span> GUESS THE NUMBER</h1>
      <hr class="divider">

      <p class="desc" id="rangeDesc">I'm thinking of a number between 1 and 100.</p>

      <div class="guess-row">
        <input type="number" id="guessInput" placeholder="Enter your guess...">
        <button class="btn-guess" id="guessBtn" onclick="checkGuess()">GUESS</button>
      </div>

      <div class="feedback empty" id="feedback">
        <div class="half">
          <div class="label low">TOO LOW</div>
          <div class="sub">Try higher</div>
        </div>
        <div class="half">
          <div class="label high">TOO HIGH</div>
          <div class="sub">Try lower</div>
        </div>
      </div>

      <div class="meta-row">
        <div class="meta-cell diff">
          <div class="meta-label">Difficulty</div>
          <div class="meta-value" id="diffValue">Medium (1-500)</div>
          <button class="change-btn" onclick="scrollToDifficulty()">CHANGE</button>
        </div>
        <div class="meta-cell attempts">
          <div class="meta-label">Attempts</div>
          <div class="meta-value" id="attemptsValue">0</div>
        </div>
        <div class="meta-cell best">
          <div class="meta-label">Best</div>
          <div class="meta-value" id="bestValue">-</div>
        </div>
      </div>

      <div class="progress-box">
        <div class="progress-label">Progress</div>
        <div class="progress-cells" id="progressCells"></div>
      </div>
    </div>

    <div class="terminal" id="terminal">
      <div class="cursor-row">&gt;_</div>
    </div>
  </div>

  <div class="right-col">
    <div class="panel">
      <div class="side-title">Stats</div>
      <div class="stat-row">
        <span class="stat-label"><span class="stat-icon">🏆</span> WINS</span>
        <span class="stat-value wins" id="statWins">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label"><span class="stat-icon">💀</span> LOSSES</span>
        <span class="stat-value losses" id="statLosses">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label"><span class="stat-icon">📊</span> BEST SCORE</span>
        <span class="stat-value" id="statBest">-</span>
      </div>
      <div class="stat-row">
        <span class="stat-label"><span class="stat-icon">🎮</span> GAMES PLAYED</span>
        <span class="stat-value" id="statGames">0</span>
      </div>
    </div>

    <div class="panel" id="difficultyPanel">
      <div class="side-title">Difficulty</div>
      <div class="diff-list" id="diffList">
        <button class="diff-btn" data-diff="easy" onclick="setDifficulty('easy')">
          <span class="arrow"></span> EASY <span class="range">(0-50)</span>
        </button>
        <button class="diff-btn active" data-diff="medium" onclick="setDifficulty('medium')">
          <span class="arrow">▶</span> MEDIUM <span class="range">(0-100)</span>
        </button>
        <button class="diff-btn" data-diff="hard" onclick="setDifficulty('hard')">
          <span class="arrow"></span> HARD <span class="range">(0-200)</span>
        </button>
        <button class="diff-btn" data-diff="insane" onclick="setDifficulty('insane')">
          <span class="arrow"></span> INSANE <span class="range">(0-500)</span>
        </button>
      </div>
      <button class="new-game" onclick="newGame()">⟲ NEW GAME</button>
    </div>
  </div>

</div>

<script>
  const difficulties = {
    easy:   { min: 0, max: 50,   attempts: 8,  label: 'Easy (0-50)' },
    medium: { min: 0, max: 100,  attempts: 10, label: 'Medium (0-100)' },
    hard:   { min: 0, max: 200,  attempts: 12, label: 'Hard (0-200)' },
    insane: { min: 0, max: 500,  attempts: 14, label: 'Insane (0-500)' }
  };

  let currentDiff = 'medium';
  let secretNumber = 0;
  let attempts = 0;
  let gameActive = true;
  let bestThisDifficulty = {};

  const stats = { wins: 0, losses: 0, best: null, games: 0 };

  function startRound(diffKey){
    currentDiff = diffKey;
    const d = difficulties[diffKey];
    secretNumber = Math.floor(Math.random() * (d.max - d.min + 1)) + d.min;
    attempts = 0;
    gameActive = true;

    document.getElementById('rangeDesc').textContent =
      `I'm thinking of a number between ${d.min} and ${d.max}.`;
    document.getElementById('diffValue').textContent = d.label;
    document.getElementById('attemptsValue').textContent = '0';
    document.getElementById('bestValue').textContent =
      bestThisDifficulty[diffKey] != null ? bestThisDifficulty[diffKey] : '-';

    resetFeedback();
    buildProgressCells(d.attempts);
    logLine(`New game started — guess a number between ${d.min} and ${d.max}.`, 'dim');

    const input = document.getElementById('guessInput');
    input.value = '';
    input.disabled = false;
    document.getElementById('guessBtn').disabled = false;
    input.focus();
  }

  function setDifficulty(diffKey){
    document.querySelectorAll('.diff-btn').forEach(btn => {
      const isActive = btn.dataset.diff === diffKey;
      btn.classList.toggle('active', isActive);
      btn.querySelector('.arrow').textContent = isActive ? '▶' : '';
    });
    startRound(diffKey);
  }

  function newGame(){
    startRound(currentDiff);
  }

  function scrollToDifficulty(){
    document.getElementById('difficultyPanel').scrollIntoView({ behavior:'smooth', block:'center' });
  }

  function buildProgressCells(max){
    const wrap = document.getElementById('progressCells');
    wrap.innerHTML = '';
    for(let i=0;i<max;i++){
      const c = document.createElement('div');
      c.className = 'cell';
      wrap.appendChild(c);
    }
  }

  function updateProgressCells(){
    const cells = document.querySelectorAll('#progressCells .cell');
    cells.forEach((c, i) => c.classList.toggle('filled', i < attempts));
  }

  function resetFeedback(){
    const fb = document.getElementById('feedback');
    fb.classList.add('empty');
  }

  function showFeedback(direction){
    const fb = document.getElementById('feedback');
    fb.classList.remove('empty');
    const low = fb.querySelector('.low').parentElement;
    const high = fb.querySelector('.high').parentElement;
    low.style.opacity = direction === 'low' ? '1' : '0.35';
    high.style.opacity = direction === 'high' ? '1' : '0.35';
  }

  function logLine(text, kind){
    const term = document.getElementById('terminal');
    const cursorRow = term.querySelector('.cursor-row');
    const line = document.createElement('div');
    line.className = 'line' + (kind ? ' ' + kind : '');
    line.textContent = '> ' + text;
    term.insertBefore(line, cursorRow);
    while (term.querySelectorAll('.line').length > 5) {
      term.removeChild(term.querySelector('.line'));
    }
  }

  function checkGuess(){
    if(!gameActive) return;
    const d = difficulties[currentDiff];
    const val = document.getElementById('guessInput').value;
    const guess = parseInt(val, 10);

    if(isNaN(guess)){
      logLine('Enter a valid number.', 'lose');
      return;
    }
    if(guess < d.min || guess > d.max){
      logLine(`Guess must be between ${d.min} and ${d.max}.`, 'lose');
      return;
    }

    attempts++;
    document.getElementById('attemptsValue').textContent = attempts;
    updateProgressCells();

    if(guess < secretNumber){
      showFeedback('low');
      logLine(`${guess} — too low.`, 'dim');
    } else if(guess > secretNumber){
      showFeedback('high');
      logLine(`${guess} — too high.`, 'dim');
    } else {
      logLine(`${guess} — correct! Solved in ${attempts} attempts.`, 'win');
      stats.wins++;
      stats.games++;
      if(bestThisDifficulty[currentDiff] == null || attempts < bestThisDifficulty[currentDiff]){
        bestThisDifficulty[currentDiff] = attempts;
        document.getElementById('bestValue').textContent = attempts;
      }
      if(stats.best == null || attempts < stats.best){ stats.best = attempts; }
      refreshStats();
      endRound();
      return;
    }

    if(attempts >= d.attempts){
      logLine(`Out of attempts. The number was ${secretNumber}.`, 'lose');
      stats.losses++;
      stats.games++;
      refreshStats();
      endRound();
    }

    document.getElementById('guessInput').value = '';
    document.getElementById('guessInput').focus();
  }

  function endRound(){
    gameActive = false;
    document.getElementById('guessInput').disabled = true;
    document.getElementById('guessBtn').disabled = true;
  }

  function refreshStats(){
    document.getElementById('statWins').textContent = stats.wins;
    document.getElementById('statLosses').textContent = stats.losses;
    document.getElementById('statBest').textContent = stats.best != null ? stats.best : '-';
    document.getElementById('statGames').textContent = stats.games;
  }

  document.getElementById('guessInput').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') checkGuess();
  });

  startRound('medium');
</script>

<script src="https://cdn.counter.dev/script.js" data-id="ae4863f7-4922-43de-b9fc-87f792b147eb" data-utcoffset="2"></script>
</body>
</html>
